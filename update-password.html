<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veribase - Konto aktivieren</title>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background-color: #14182b;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .logo-box img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.2rem;
        }

        .error {
            color: #f87171;
        }

        .success {
            color: #4ade80;
        }

        footer {
            display: flex;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 2rem;
        }

        footer a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="logo.png" alt="Veribase Logo">
        </div>

        <h1>Veribase</h1>
        <p class="subtitle">Lege deinen Anzeigenamen und dein Passwort fest, um dein Konto zu aktivieren.</p>

        <div id="updateForm" style="width: 100%;">
            <div class="form-group">
                <label for="displayName">Anzeigename</label>
                <input type="text" id="displayName" placeholder="z. B. Björn">
            </div>

            <div class="form-group">
                <label for="password">Neues Passwort</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button type="button" class="btn-primary" id="submitBtn">Konto aktivieren &rarr;</button>
        </div>

        <div id="message"></div>
    </div>

    <footer>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="agb.html">AGB (B2B)</a>
    </footer>

    <script>
        const SUPABASE_URL = 'https://cvfbkxzfpxopbkaymvvf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2ZmJreHpocHhvcGJrYXltdnZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTEwMzYsImV4cCI6MjEwNjc2NzAzNn0.E96FjN8lQvjJcZn3kHhAk5uVa-mzzan63gPb9z5vJqw';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        // Universeller Token-Parser für den Supabase-Link
        window.addEventListener('DOMContentLoaded', async () => {
            messageEl.textContent = "Überprüfe Einladungs-Link...";

            const fullUrl = window.location.href;
            
            // Prüfen ob ein Token im Hash enthalten ist (z.B. #access_token=... oder token_hash)
            if (fullUrl.includes('#')) {
                const hashPart = fullUrl.split('#')[1];
                // Entferne führende Slashes wie /data?
                const cleanHash = hashPart.replace(/^\/[^?]+\?/, '');
                const params = new URLSearchParams(cleanHash);

                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');
                const tokenHash = params.get('token_hash');
                const type = params.get('type');

                if (accessToken && refreshToken) {
                    const { error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                    if (error) {
                        messageEl.textContent = "Session-Fehler: " + error.message;
                        messageEl.className = "error";
                    } else {
                        messageEl.textContent = "Bereit zur Aktivierung.";
                        messageEl.className = "success";
                        return;
                    }
                } else if (tokenHash && type) {
                    const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: type });
                    if (error) {
                        messageEl.textContent = "Verifizierungs-Fehler: " + error.message;
                        messageEl.className = "error";
                    } else {
                        messageEl.textContent = "Bereit zur Aktivierung.";
                        messageEl.className = "success";
                        return;
                    }
                }
            }

            // Fallback: Prüfen ob direkt in den normalen Suchparametern
            const urlParams = new URLSearchParams(window.location.search);
            const queryTokenHash = urlParams.get('token_hash');
            const queryType = urlParams.get('type');
            if (queryTokenHash && queryType) {
                const { error } = await supabase.auth.verifyOtp({ token_hash: queryTokenHash, type: queryType });
                if (error) {
                    messageEl.textContent = "Fehler: " + error.message;
                    messageEl.className = "error";
                } else {
                    messageEl.textContent = "Bereit zur Aktivierung.";
                    messageEl.className = "success";
                    return;
                }
            }

            // Letzter Check: Ist evtl. schon eine Session da?
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                messageEl.textContent = "Bereit zur Aktivierung.";
                messageEl.className = "success";
            } else {
                messageEl.textContent = "Kein gültiger Token im Link gefunden.";
                messageEl.className = "error";
            }
        });

        // Button-Klick zum Speichern von Passwort & Display Name
        submitBtn.addEventListener('click', async () => {
            const newPassword = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value;

            if (!newPassword || newPassword.length < 6) {
                messageEl.textContent = "Passwort muss mindestens 6 Zeichen lang sein.";
                messageEl.className = "error";
                return;
            }

            if (!displayName) {
                messageEl.textContent = "Bitte gib einen Anzeigenamen ein.";
                messageEl.className = "error";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird gespeichert...';
            messageEl.textContent = 'Übertrage Daten an Supabase...';
            messageEl.className = '';

            try {
                const { data, error } = await supabase.auth.updateUser({
                    password: newPassword,
                    data: { display_name: displayName }
                });

                if (error) throw error;

                console.log("Erfolgreich gespeichert:", data);
                messageEl.textContent = "Konto erfolgreich aktiviert! Weiterleitung...";
                messageEl.className = "success";

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (err) {
                console.error("Fehler:", err);
                messageEl.textContent = "Fehler: " + (err.message || err);
                messageEl.className = "error";
                submitBtn.disabled = false;
                submitBtn.textContent = 'Konto aktivieren →';
            }
        });
    </script>
</body>
</html>
