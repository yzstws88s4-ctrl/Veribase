<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veribase - Konto aktivieren</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .container { width: 100%; max-width: 400px; background: #14182b; padding: 2.5rem 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
        .form-group { text-align: left; margin-bottom: 1rem; }
        label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 0.4rem; }
        input { width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 1rem; }
        input:focus { outline: none; border-color: #6366f1; }
        button { width: 100%; padding: 0.85rem; background: #6366f1; color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #4f46e5; }
        #message { margin-top: 1rem; font-size: 0.85rem; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Veribase</h1>
        <p>Lege dein Passwort fest, um dein Konto zu aktivieren.</p>

        <form id="form">
            <div class="form-group">
                <label>Anzeigename</label>
                <input type="text" id="name" placeholder="Dein Name" required>
            </div>
            <div class="form-group">
                <label>Neues Passwort</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" id="btn">Konto aktivieren</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cvfbkxzfpxopbkaymvvf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2ZmJreHpocHhvcGJrYXltdnZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTEwMzYsImV4cCI6MjEwNjc2NzAzNn0.E96FjN8lQvjJcZn3kHhAk5uVa-mzzan63gPb9z5vJqw';

        // Eindeutiger Variablenname sb, um jegliche Konflikte zu verhindern
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { detectSessionInUrl: true }
        });

        const msg = document.getElementById('message');
        const btn = document.getElementById('btn');

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Speichere...';
            msg.textContent = '';

            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            try {
                const { error } = await sb.auth.updateUser({
                    password: password,
                    data: { display_name: name }
                });

                if (error) throw error;

                msg.textContent = "Erfolgreich! Weiterleitung zum Login...";
                msg.className = "success";

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                console.error(err);
                msg.textContent = "Fehler: " + err.message;
                msg.className = "error";
                btn.disabled = false;
                btn.textContent = 'Konto aktivieren';
            }
        });
    </script>
</body>
</html>
