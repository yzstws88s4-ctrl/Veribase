<script>
    const SUPABASE_URL = 'https://cvfbkxzfpxopbkaymvvf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2ZmJreHpocHhvcGJrYXltdnZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTEwMzYsImV4cCI6MjEwNjc2NzAzNn0.E96FjN8lQvjJcZn3kHhAk5uVa-mzzan63gPb9z5vJqw';
    
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
            detectSessionInUrl: true,
            persistSession: true
        }
    });

    const msg = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    // EXPLICIT TOKEN EXCHANGE: Fängt den Auth-Code/Token direkt ab und baut die Session auf
    window.addEventListener('DOMContentLoaded', async () => {
        const hash = window.location.hash;
        const search = window.location.search;

        // Wenn ein Code oder Token in der URL ist, holen wir die Session sofort ab
        if (hash.includes('access_token') || search.includes('code') || search.includes('token_hash')) {
            try {
                // Supabase v2 Standard-Methode zum Umwandeln des URL-Codes in eine echte Session
                const { data, error } = await sbClient.auth.getSession();
                if (error) console.error(error);
                if (data.session) {
                    msg.textContent = "Sitzung erfolgreich hergestellt!";
                    msg.className = "success";
                }
            } catch (err) {
                console.error("Session-Init Fehler:", err);
            }
        }
    });

    // Formular absenden
    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const pwd = document.getElementById('password').value;
        const name = document.getElementById('displayName').value;

        btn.disabled = true;
        btn.textContent = 'Wird gespeichert...';
        msg.textContent = '';

        try {
            // Letzter Sicherheitscheck: Falls Session fehlt, holen wir sie direkt aus dem Storage
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) {
                throw new Error("Keine aktive Sitzung gefunden. Bitte öffne einen brandneuen Einladungs-Link.");
            }

            const { data, error } = await sbClient.auth.updateUser({
                password: pwd,
                data: { display_name: name }
            });

            if (error) throw error;

            msg.textContent = "Erfolgreich! Weiterleitung zur Anmeldung...";
            msg.className = "success";

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);

        } catch (err) {
            console.error(err);
            msg.textContent = "Fehler: " + err.message;
            msg.className = "error";
            btn.disabled = false;
            btn.textContent = 'Konto aktivieren →';
        }
    });
</script>
