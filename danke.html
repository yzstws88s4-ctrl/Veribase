<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veribase – Vielen Dank für Ihre Buchung</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg: #030712;
      --surface: rgba(17, 24, 39, 0.75);
      --text: #f9fafb;
      --text-sub: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-line: rgba(99, 102, 241, 0.4);
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 500px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(3,7,18,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
      margin: 20px;
      text-align: center;
    }

    .brand-logo-container {
      width: 56px;
      height: 56px;
      background: var(--surface);
      border: 1px solid var(--accent-line);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 25px -5px var(--accent-glow);
    }

    .brand-logo-container img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    /* Fallback falls logo.png nicht da ist */
    .brand-fallback {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-sub);
      font-size: 13.5px;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }

    .btn-main {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14.5px;
      text-decoration: none;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-main:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .footer-links {
      margin-top: 28px;
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 12px;
      color: var(--text-sub);
      position: relative;
      z-index: 1;
    }

    .footer-links a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <div class="card">
    <div class="brand-logo-container">
      <!-- Nutzt genau denselben Logo-Stil wie deine Login-Ansicht -->
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span class="brand-fallback" style="display:none;">V</span>
    </div>

    <h1>Vielen Dank für Ihre Buchung</h1>
    <p>Ihre Zahlung war erfolgreich und Ihr Workspace wird vorbereitet. Sie erhalten in Kürze eine E-Mail mit Ihrem persönlichen Link, um Ihr Administrator-Konto einzurichten.</p>

    <a href="index.html" class="btn-main">Zur Startseite &rarr;</a>
  </div>

  <div class="footer-links">
    <a href="impressum.html">Impressum</a>
    <span>•</span>
    <a href="datenschutz.html">Datenschutz</a>
    <span>•</span>
    <a href="agb.html">AGB (B2B)</a>
  </div>

</body>
</html>
